# Pre-launch release pipeline (docs/operations/release.md §Pre-launch mode).
#
# A merge to main runs build-test, deploys staging and, once staging really deployed, releases to
# production with no human approver: upload every changed Worker at 0%, verify the candidates on
# the canary host, then move every Worker to 100% in one job. A failure before promote leaves every
# version at 0%. workflow_dispatch exists to re-run a merge. Nothing here sets a Worker secret: they live in Secrets
# Store (release.md §Credentials), and each Cloudflare token belongs to one GitHub environment.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CODEOWNERS"
      - ".claudinite/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WRANGLER_SEND_METRICS: "false"
  # The self-test stage of verify. Off until the SELFTEST_HMAC_KEY environment secrets exist (#158); even when "true" it
  # skips with a logged reason while the key is absent.
  VERIFY_SELFTEST: "false"

# One deploy at a time; a newer merge waits instead of cancelling a deploy that is mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint, typecheck and the repository checks
        run: pnpm check
      - name: unit tests, infra tests and in-process scenarios
        run: pnpm test
      # No scenario that existed before this push may have changed or disappeared.
      - name: scenario stability
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node tools/check-scenarios.mjs --base "$BEFORE"
          else
            echo "::notice::no previous main commit to compare scenarios against; the base check is skipped"
          fi
      # IT-OPS-003: the bundles that would ship carry no test string.
      - name: build the production bundles and grep them
        run: |
          node tools/release/verify.mjs build --out dist/release
          node tools/release/verify.mjs grep --out dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  deploy-staging:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.suite.outcome == 'success' }}
    steps:
      # Handled outcome, not a failure: the staging environment has no credentials until the account exists (I-1).
      - id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::the staging environment has no Cloudflare credentials yet; nothing deployed"; fi
      - if: steps.configured.outputs.yes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.configured.outputs.yes == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.configured.outputs.yes == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.configured.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.yes == 'true'
        name: staging migrations, then each Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release/promote.mjs staging
      # The full suite over http. The staging Access token reaches the two staging hostnames only.
      - if: steps.configured.outputs.yes == 'true'
        id: suite
        name: full scenario suite over http
        env:
          TEST_DRIVER: http
          PACKSERVER_BASE_URL: https://registry-staging.claudinite.com
          PACKSERVER_ACCESS_HOST: registry-staging.claudinite.com
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SELFTEST_HMAC_KEY: ${{ secrets.SELFTEST_HMAC_KEY }}
        run: pnpm exec vitest run --project scenarios --passWithNoTests --reporter=default --reporter=junit --outputFile.junit=reports/scenarios.xml
      - if: always() && steps.configured.outputs.yes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-junit
          path: reports/
          if-no-files-found: ignore

  # upload-production, verify and promote are steps of one job: a failure before promote leaves
  # every version at 0%. No person approves it (release.md Principle 3); the `production`
  # environment is restricted to main. It runs only when staging really deployed.
  release:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && needs.deploy-staging.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      # Handled outcome, not a failure: production has no credentials until the account exists (I-1).
      - id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::the production environment has no Cloudflare credentials yet; nothing released"; fi
      - if: steps.configured.outputs.yes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.configured.outputs.yes == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.configured.outputs.yes == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.configured.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.yes == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: dist/release/
      - if: steps.configured.outputs.yes == 'true'
        id: release
        run: |
          id=$(node tools/release/manifest.mjs id)
          [ -n "$id" ] || { echo "::error::no release id was computed"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # The incumbent's bundles, verified against its manifest and tag, for the service-binding contract run.
      - if: steps.configured.outputs.yes == 'true'
        name: N/N-1 contract run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tools/build-n-minus-1.mjs --out dist/n-minus-1
          PACKSERVER_N_MINUS_1_DIR="$PWD/dist/n-minus-1" pnpm exec vitest run --project scenarios --tagsFilter compat --passWithNoTests
      # Expand migrations, then one version per changed Worker at 0%; the manifest is written to ops.
      - if: steps.configured.outputs.yes == 'true'
        name: upload-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release/manifest.mjs cut --digests dist/release/digests.json --bundles dist/release
      - if: steps.configured.outputs.yes == 'true'
        name: verify
        env:
          ID: ${{ steps.release.outputs.id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SELFTEST_HMAC_KEY: ${{ secrets.SELFTEST_HMAC_KEY }}
        run: |
          [ -n "$ID" ] || { echo "::error::no release id"; exit 1; }
          node tools/release/verify.mjs candidate --release "$ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.configured.outputs.yes == 'true'
        with:
          name: verify-junit
          path: reports/
          if-no-files-found: ignore
      - if: steps.configured.outputs.yes == 'true'
        name: promote
        env:
          ID: ${{ steps.release.outputs.id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$ID" ] || { echo "::error::no release id"; exit 1; }
          node tools/release/promote.mjs release --release "$ID"
      - if: steps.configured.outputs.yes == 'true'
        name: finalise
        env:
          ID: ${{ steps.release.outputs.id }}
          TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$ID" ] || { echo "::error::no release id"; exit 1; }
          message=$(node tools/release/manifest.mjs tag-message --release "$ID")
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "v$ID" -m "$message"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/v$ID"
          node tools/release/manifest.mjs set --release "$ID" --state finalised
          echo "released \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
