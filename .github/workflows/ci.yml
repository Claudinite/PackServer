# The CI a repo with none of its own is given; it is the repo's from then
# on. A task's delivery dispatches it on the pull request it opens.
name: ci

on:
  # A draft is work in progress: its checks start once it is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push supersedes the older run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Claudinite's checks; the engine update keeps these steps current.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/claudinite
            ~/.npm/_cacache
          key: cn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claudinite/settings.yaml') }}
          restore-keys: cn-${{ runner.os }}-${{ runner.arch }}-
      - name: install the engine settings.yaml pins
        run: npx --yes --prefer-offline @claudinite/setup@1.0.1
      - name: name the Claudinite checks build
        id: claudinite-checks
        continue-on-error: true
        run: .claudinite/bin/cn check key >> "$GITHUB_OUTPUT"
      - if: steps.claudinite-checks.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.claudinite-checks.outputs.dir }}
          key: claudinite-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.claudinite-checks.outputs.key }}
      - name: cn check work-and-world
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .claudinite/bin/cn check work-and-world

  # Docs-only changes skip the product jobs; the Claudinite check above still runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      start: ${{ steps.diff.outputs.start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          code=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/requirements/*|docs/testing/*) code=true ;;
                docs/*|*.md|CODEOWNERS|.claudinite/*) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$BASE" "$HEAD")
          fi
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Requirement and test-register edits never skip; this needs no install.
  coverage:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node docs/testing/coverage.mjs --check

  # Each job is billed by the minute, so the legs are as few as keep the push under budget.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node tools/check-rules.mjs && node tools/check-bindings.mjs && node infra/apply-ids.mjs --check && pnpm db:check

  # The workspace packages, listed from the workspace itself, are dealt round-robin across the
  # matrix, whose size is the only place the shard count is written.
  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck this shard's packages
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          filters=$(pnpm ls -r --depth -1 --json | node -e '
            const pkgs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const names = pkgs.filter((p) => p.name !== "packserver").map((p) => p.name).sort();
            const [shard, total] = process.argv.slice(1).map(Number);
            console.log(names.filter((_, i) => i % total === shard - 1).map((n) => "--filter=" + n).join(" "));
          ' "$SHARD" "$TOTAL")
          echo "packages: $filters"
          [ -n "$filters" ] || { echo "::error::shard $SHARD of $TOTAL has no packages"; exit 1; }
          pnpm exec turbo run typecheck --only $filters

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: test this shard's packages
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          filters=$(pnpm ls -r --depth -1 --json | node -e '
            const pkgs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const names = pkgs.filter((p) => p.name !== "packserver").map((p) => p.name).sort();
            const [shard, total] = process.argv.slice(1).map(Number);
            console.log(names.filter((_, i) => i % total === shard - 1).map((n) => "--filter=" + n).join(" "));
          ' "$SHARD" "$TOTAL")
          echo "packages: $filters"
          [ -n "$filters" ] || { echo "::error::shard $SHARD of $TOTAL has no packages"; exit 1; }
          pnpm exec turbo run test --only $filters

  infra:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:infra

  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project scenarios --passWithNoTests --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=junit --outputFile.junit=reports/scenarios-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenarios-junit-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore

  # The one check to require: green when every product job passed or was skipped as docs-only.
  summary:
    needs: [check, changes, coverage, checks, typecheck, unit, infra, scenarios]
    if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          START: ${{ needs.changes.outputs.start }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "job results: $RESULTS"
          if [ -n "$START" ]; then
            elapsed=$(( $(date +%s) - START ))
            echo "start: changes job output (set by the first attempt unless changes re-ran); this is attempt $ATTEMPT"
            echo "elapsed: ${elapsed}s (budget 120s)"
            # Judged on every attempt: a re-run of failed jobs keeps the first attempt's start from the
            # changes job, so a breach stays red. Only "re-run all jobs", which runs changes again,
            # clears it, so retry a slow run with re-run all.
            if [ "$elapsed" -gt 120 ]; then
              echo "::error::push CI took ${elapsed}s, over the 2-minute budget"
              exit 1
            fi
          fi
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
