# Builds the two validation sandbox images and runs the bomb corpus through sandbox A on Docker.
# Its own workflow so push CI stays inside its 120 s budget: it runs on sandbox/** changes, weekly,
# and on demand. A build that is not a pull request also publishes the image and its digest.
name: sandbox-images

on:
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-images.yml"
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-images.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sandbox-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [a, b]
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      REPO: ghcr.io/${{ github.repository_owner }}/packserver-sandbox-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image B arrives with its own task; until its Dockerfile exists its leg has nothing to build.
      - id: has
        run: |
          if [ -f "sandbox/image-${{ matrix.image }}/Dockerfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::sandbox/image-${{ matrix.image }}/Dockerfile does not exist yet; nothing to build"; fi
      - if: steps.has.outputs.present == 'true'
        run: docker build -f "sandbox/image-${{ matrix.image }}/Dockerfile" -t "sandbox-${{ matrix.image }}:ci" .
      - if: steps.has.outputs.present == 'true' && env.PUBLISH == 'true'
        id: publish
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "sandbox-${{ matrix.image }}:ci" "$REPO:${{ github.sha }}"
          docker push "$REPO:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:${{ github.sha }}" | sed 's/.*@//')
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::no digest was recorded for the pushed image"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p digests
          printf '{"image":"%s","digest":"%s","commit":"%s"}\n' "$REPO" "$digest" "${{ github.sha }}" > "digests/sandbox-${{ matrix.image }}.json"
          echo "sandbox-${{ matrix.image }} \`$REPO@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.has.outputs.present == 'true' && env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-digest-${{ matrix.image }}
          path: digests/
          if-no-files-found: error
      # The bomb corpus runs against sandbox A with the production restrictions (internet off, read-only
      # root, no capabilities, memory, CPU and process caps).
      - if: matrix.image == 'a'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: matrix.image == 'a'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.image == 'a'
        run: |
          pnpm install --frozen-lockfile --filter @packserver/sandbox-runner...
          pnpm --filter @packserver/sandbox-runner build
          node sandbox/runner/dist/a-corpus.mjs "sandbox-a:ci" "${{ steps.publish.outputs.digest }}"
