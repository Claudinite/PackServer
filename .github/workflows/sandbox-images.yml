# Builds the two validation sandbox images and runs the bomb corpus through sandbox A on Docker.
# Its own workflow so push CI stays inside its 120 s budget: it runs on sandbox/** changes
# and on demand (the repo permits no cron but the Claudinite scheduler, so the weekly run is a
# dispatch of this workflow). Only after the corpus passes does a separate job, which alone holds
# packages: write, publish the image and its digest.
name: sandbox-images

on:
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-images.yml"
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-images.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sandbox-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image B arrives with its own task; until its Dockerfile exists its leg has nothing to build.
      - id: has
        run: |
          if [ -f "sandbox/image-${{ matrix.image }}/Dockerfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::sandbox/image-${{ matrix.image }}/Dockerfile does not exist yet; nothing to build"; fi
      - if: steps.has.outputs.present == 'true'
        run: docker build -f "sandbox/image-${{ matrix.image }}/Dockerfile" -t "sandbox-${{ matrix.image }}:ci" .
      # The bomb corpus runs against sandbox A with the production restrictions (internet off, read-only
      # root, no capabilities, memory, CPU and process caps).
      - if: matrix.image == 'a'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: matrix.image == 'a'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.image == 'a'
        run: |
          pnpm install --frozen-lockfile --filter @packserver/sandbox-runner...
          pnpm --filter @packserver/sandbox-runner build
          node sandbox/runner/dist/a-corpus.mjs "sandbox-a:ci"
      # The tested image itself is handed to the publish job, so what ships is what passed.
      - if: steps.has.outputs.present == 'true' && github.event_name != 'pull_request'
        run: mkdir -p handoff && docker save "sandbox-${{ matrix.image }}:ci" | gzip > "handoff/image-${{ matrix.image }}.tar.gz"
      - if: steps.has.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ matrix.image }}
          path: handoff/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: sandbox
      # Leg B has an image to publish exactly when its Dockerfile exists; a missing handoff for a leg that has one fails the download.
      - id: has
        run: |
          if [ -f "sandbox/image-${{ matrix.image }}/Dockerfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image-${{ matrix.image }}
          path: handoff/
      - if: steps.has.outputs.present == 'true'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/packserver-sandbox-${{ matrix.image }}"
          gunzip -c "handoff/image-${{ matrix.image }}.tar.gz" | docker load
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "sandbox-${{ matrix.image }}:ci" "$repo:${{ github.sha }}"
          docker push "$repo:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:${{ github.sha }}" | sed 's/.*@//')
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::no digest was recorded for the pushed image"; exit 1 ;; esac
          mkdir -p digests
          printf '{"image":"%s","digest":"%s","commit":"%s"}\n' "$repo" "$digest" "${{ github.sha }}" > "digests/sandbox-${{ matrix.image }}.json"
          echo "sandbox-${{ matrix.image }} \`$repo@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.has.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-digest-${{ matrix.image }}
          path: digests/
          if-no-files-found: error
